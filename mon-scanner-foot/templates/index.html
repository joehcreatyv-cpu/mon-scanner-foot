<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootScan AI - Minimal</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #238636;
            --gold: #d29922;
            --blue: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            font-size: 13px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .btn-scan {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-scan:hover { opacity: 0.9; }
        .sector-title {
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px;
        }
        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            color: #8b949e;
            font-size: 11px;
            margin-bottom: 5px;
        }
        .teams {
            font-weight: bold;
            font-size: 14px;
            color: #f0f6fc;
            margin-bottom: 8px;
        }
        .odds-bar {
            display: flex;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
            background: #21262d;
        }
        .prob-h { background: #238636; }
        .prob-d { background: #d29922; }
        .prob-a { background: #8957e5; }
        .pick-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #21262d;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .conf-badge {
            background: #1f6beb;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
        .empty-msg {
            color: #8b949e;
            font-style: italic;
            padding: 8px 0;
        }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight:bold; font-size:16px;">⚽ FootScan AI</div>
    <div id="time-window" style="color:#8b949e; font-size:12px;">--:-- UTC</div>
    <button class="btn-scan" onclick="fetchScan()">LANCER LE SCAN</button>
</div>

<div class="sector-title" style="color: var(--accent);">👑 Secteur Premium (≥ 80%) <span id="count-premium"></span></div>
<div class="match-grid" id="grid-premium"></div>

<div class="sector-title" style="color: var(--gold);">⭐ Secteur Gold (69% - 79%) <span id="count-gold"></span></div>
<div class="match-grid" id="grid-gold"></div>

<div class="sector-title" style="color: var(--blue);">⚽ Autres Rencontres <span id="count-top"></span></div>
<div class="match-grid" id="grid-top"></div>

<script>
async function fetchScan() {
    const btn = document.querySelector('.btn-scan');
    btn.innerText = "Analyse...";
    btn.disabled = true;

    try {
        const res = await fetch('/api/scan');
        const data = await res.json();

        document.getElementById('time-window').innerText = "Fenêtre : " + data.time_window;
        
        renderSector('grid-premium', 'count-premium', data.premium);
        renderSector('grid-gold', 'count-gold', data.gold);
        renderSector('grid-top', 'count-top', data.top_leagues);

    } catch (e) {
        alert("Erreur lors de la récupération des données.");
    } finally {
        btn.innerText = "LANCER LE SCAN";
        btn.disabled = false;
    }
}

function renderSector(gridId, countId, matches) {
    const grid = document.getElementById(gridId);
    const count = document.getElementById(countId);
    count.innerText = `(${matches.length})`;
    grid.innerHTML = "";

    if (matches.length === 0) {
        grid.innerHTML = `<div class="empty-msg">Aucun match trouvé dans ce secteur.</div>`;
        return;
    }

    matches.forEach(m => {
        const pick = m.selected_pick;
        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
            <div class="match-header">
                <span>${m.league}</span>
                <span>${m.date} ${m.time} UTC</span>
            </div>
            <div class="teams">${m.home} vs ${m.away}</div>
            <div class="odds-bar">
                <div class="prob-h" style="width: ${m.analysis.p_home}%" title="Dom: ${m.analysis.p_home}%"></div>
                <div class="prob-d" style="width: ${m.analysis.p_draw}%" title="Nul: ${m.analysis.p_draw}%"></div>
                <div class="prob-a" style="width: ${m.analysis.p_away}%" title="Ext: ${m.analysis.p_away}%"></div>
            </div>
            <div class="pick-box">
                <span>🎯 ${pick.pick}</span>
                <span class="conf-badge">${pick.confidence}%</span>
            </div>
        `;
        grid.appendChild(card);
    });
}
</script>

</body>
</html>
