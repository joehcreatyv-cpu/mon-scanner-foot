<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootScan AI - Modern Dark</title>
    <style>
        :root {
            --bg: #0b0c10;
            --card-bg: #14161d;
            --border: #232733;
            --text-main: #ffffff;
            --text-muted: #7e859b;
            --orange: #ff5e1e;
            --orange-soft: rgba(255, 94, 30, 0.15);
            --green: #00e676;
            --accordion-bg: #101218;
            --sub-accordion-bg: #181b24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
        }
        .brand span { color: var(--orange); }

        .btn-scan {
            background: var(--orange);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-scan.scanning {
            opacity: 0.7;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 94, 30, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(255, 94, 30, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 94, 30, 0); }
        }

        /* Structure Rétractable Sans Blocage de Hauteur */
        .country-accordion {
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--accordion-bg);
            overflow: hidden;
        }

        .country-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            user-select: none;
        }

        .country-header:hover { background: #161820; }

        .badge-max {
            background: var(--orange-soft);
            color: var(--orange);
            border: 1px solid var(--orange);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .chevron {
            transition: transform 0.3s ease;
            font-size: 12px;
            color: var(--text-muted);
        }

        .country-accordion.active > .country-header .chevron,
        .league-accordion.active > .league-header .chevron {
            transform: rotate(180deg);
            color: var(--orange);
        }

        .country-body {
            display: none;
            padding: 10px 14px 14px 14px;
        }

        .country-accordion.active > .country-body {
            display: block;
        }

        .league-accordion {
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--sub-accordion-bg);
            overflow: hidden;
        }

        .league-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            user-select: none;
        }

        .league-body {
            display: none;
            padding: 12px;
        }

        .league-accordion.active > .league-body {
            display: block;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }

        .match-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .teams-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .demo-section {
            background: #0f1015;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .demo-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .donut-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }

        .circle-stat {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            margin: 0 auto 4px auto;
        }

        .prediction-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--orange-soft);
            border: 1px solid var(--orange);
            color: var(--orange);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">FootScan <span>AI</span></div>
    <div id="time-window" style="color: var(--text-muted); font-size: 13px;">--:-- UTC</div>
    <button class="btn-scan" onclick="runScan()">LANCER LE SCAN</button>
</div>

<div id="content-container"></div>

<script>
async function runScan() {
    const btn = document.querySelector('.btn-scan');
    btn.classList.add('scanning');
    btn.innerText = "SCAN EN COURS...";
    btn.disabled = true;

    try {
        const res = await fetch('/api/scan');
        const data = await res.json();

        document.getElementById('time-window').innerText = "Fenêtre d'Analyse : " + data.time_window;
        const container = document.getElementById('content-container');
        container.innerHTML = "";

        data.countries.forEach((countryData, cIndex) => {
            const countryAcc = document.createElement('div');
            countryAcc.className = 'country-accordion' + (cIndex === 0 ? ' active' : '');

            let leaguesHTML = '';
            countryData.leagues.forEach((leagueData, lIndex) => {
                let matchesHTML = '';
                leagueData.matches.forEach(m => {
                    const demo = m.analysis.demographics;
                    matchesHTML += `
                        <div class="match-card">
                            <div class="match-meta">
                                <span>xG: ${m.analysis.xg_home} - ${m.analysis.xg_away}</span>
                                <span>${m.time} UTC</span>
                            </div>
                            <div class="teams-title">${m.home} vs ${m.away}</div>

                            <div class="demo-section">
                                <div class="demo-title">Dominance Démographique</div>
                                <div class="donut-container">
                                    <div>
                                        <div class="circle-stat">${demo.dom_domination}%</div>
                                        <span style="font-size:9px; color:var(--text-muted)">Domicile</span>
                                    </div>
                                    <div>
                                        <div class="circle-stat" style="border-color: var(--green);">${demo.ext_domination}%</div>
                                        <span style="font-size:9px; color:var(--text-muted)">Extérieur</span>
                                    </div>
                                </div>
                            </div>

                            <div class="prediction-badge">
                                <span>🎯 ${m.analysis.selected_pick}</span>
                                <span>${m.analysis.confidence}% Confiance</span>
                            </div>
                        </div>
                    `;
                });

                const isLeagueActive = (cIndex === 0 && lIndex === 0) ? 'active' : '';

                leaguesHTML += `
                    <div class="league-accordion ${isLeagueActive}">
                        <div class="league-header" onclick="toggleAcc(this)">
                            <span>🏆 ${leagueData.league_name} (${leagueData.matches.length})</span>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="badge-max">Max ${leagueData.max_confidence}%</span>
                                <span class="chevron">▼</span>
                            </div>
                        </div>
                        <div class="league-body">
                            <div class="match-grid">${matchesHTML}</div>
                        </div>
                    </div>
                `;
            });

            countryAcc.innerHTML = `
                <div class="country-header" onclick="toggleAcc(this)">
                    <div>📍 ${countryData.country_name}</div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge-max">Top Confiance ${countryData.max_confidence}%</span>
                        <span class="chevron">▼</span>
                    </div>
                </div>
                <div class="country-body">
                    ${leaguesHTML}
                </div>
            `;

            container.appendChild(countryAcc);
        });

    } catch (e) {
        alert("Erreur lors de la récupération des métriques.");
    } finally {
        btn.classList.remove('scanning');
        btn.innerText = "LANCER LE SCAN";
        btn.disabled = false;
    }
}

function toggleAcc(headerEl) {
    const parent = headerEl.parentElement;
    parent.classList.toggle('active');
}
</script>

</body>
</html>
