<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootScan AI - Advanced Dark Mode</title>
    <style>
        :root {
            --bg: #0b0c10;
            --card-bg: #14161d;
            --border: #232733;
            --text-main: #ffffff;
            --text-muted: #7e859b;
            --orange: #ff5e1e;
            --orange-soft: rgba(255, 94, 30, 0.15);
            --green: #00e676;
            --accordion-bg: #101218;
            --sub-accordion-bg: #181b24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand span { color: var(--orange); }

        /* Animation Scan */
        .btn-scan {
            background: var(--orange);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-scan:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-scan.scanning {
            background: #e04e12;
            animation: pulse 1.5s infinite;
        }

        .btn-scan.scanning::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 94, 30, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(255, 94, 30, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 94, 30, 0); }
        }

        @keyframes shimmer {
            100% { left: 100%; }
        }

        /* Accordéons rétractables Pays */
        .country-accordion {
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--accordion-bg);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .country-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            font-weight: 700;
            font-size: 15px;
            background: var(--accordion-bg);
            transition: background 0.2s;
        }

        .country-header:hover {
            background: #161820;
        }

        .country-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-max {
            background: var(--orange-soft);
            color: var(--orange);
            border: 1px solid var(--orange);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .chevron {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 12px;
            color: var(--text-muted);
        }

        .country-accordion.active > .country-header .chevron {
            transform: rotate(180deg);
            color: var(--orange);
        }

        /* Conteneur Pays rétractable */
        .country-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 14px;
        }

        .country-accordion.active > .country-body {
            padding: 10px 14px 14px 14px;
        }

        /* Accordéons rétractables Ligues */
        .league-accordion {
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--sub-accordion-bg);
            overflow: hidden;
        }

        .league-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .league-header:hover {
            color: var(--text-main);
        }

        .league-accordion.active > .league-header .chevron {
            transform: rotate(180deg);
            color: var(--orange);
        }

        .league-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 10px;
        }

        .league-accordion.active > .league-body {
            padding: 10px;
        }

        /* Grille des matchs */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            transition: transform 0.2s;
        }

        .match-card:hover {
            transform: translateY(-2px);
        }

        .match-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .teams-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* Modèle 2 - Démographie */
        .demo-section {
            background: #0f1015;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .demo-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .donut-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }

        .circle-stat {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            margin: 0 auto 4px auto;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
        }

        .bar-fill {
            height: 5px;
            background: var(--orange);
            border-radius: 3px;
        }

        .prediction-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--orange-soft);
            border: 1px solid var(--orange);
            color: var(--orange);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">FootScan <span>AI</span></div>
    <div id="time-window" style="color: var(--text-muted); font-size: 13px;">--:-- UTC</div>
    <button class="btn-scan" onclick="runScan()">LANCER LE SCAN</button>
</div>

<div id="content-container"></div>

<script>
async function runScan() {
    const btn = document.querySelector('.btn-scan');
    btn.classList.add('scanning');
    btn.innerText = "SCAN EN COURS...";
    btn.disabled = true;

    try {
        const res = await fetch('/api/scan');
        const data = await res.json();

        document.getElementById('time-window').innerText = "Fenêtre d'Analyse : " + data.time_window;
        const container = document.getElementById('content-container');
        container.innerHTML = "";

        data.countries.forEach((countryData, cIndex) => {
            const countryAcc = document.createElement('div');
            countryAcc.className = 'country-accordion';

            // Par défaut, on ouvre le 1er pays (le meilleur %)
            if (cIndex === 0) countryAcc.classList.add('active');

            let leaguesHTML = '';
            countryData.leagues.forEach((leagueData, lIndex) => {
                let matchesHTML = '';
                leagueData.matches.forEach(m => {
                    const demo = m.analysis.demographics;
                    matchesHTML += `
                        <div class="match-card">
                            <div class="match-meta">
                                <span>${m.league}</span>
                                <span>${m.time} UTC</span>
                            </div>
                            <div class="teams-title">${m.home} vs ${m.away}</div>

                            <div class="demo-section">
                                <div class="demo-title">Dominance Démographique</div>
                                <div class="donut-container">
                                    <div>
                                        <div class="circle-stat">${demo.dom_domination}%</div>
                                        <span style="font-size:9px; color:var(--text-muted)">Dom. Domicile</span>
                                    </div>
                                    <div>
                                        <div class="circle-stat" style="border-color: var(--green);">${demo.ext_domination}%</div>
                                        <span style="font-size:9px; color:var(--text-muted)">Dom. Extérieur</span>
                                    </div>
                                </div>
                            </div>

                            <div class="demo-section">
                                <div class="demo-title">Pression par tranche d'âge/temps</div>
                                <div class="bar-group">
                                    <div class="bar-row">
                                        <span style="width:40px;">16-30m</span>
                                        <div style="flex:1; background:#232733; border-radius:3px;">
                                            <div class="bar-fill" style="width: ${demo.age_intensity['16-30m']}%;"></div>
                                        </div>
                                        <span>${demo.age_intensity['16-30m']}%</span>
                                    </div>
                                    <div class="bar-row">
                                        <span style="width:40px;">61-90m</span>
                                        <div style="flex:1; background:#232733; border-radius:3px;">
                                            <div class="bar-fill" style="width: ${demo.age_intensity['61-90m']}%;"></div>
                                        </div>
                                        <span>${demo.age_intensity['61-90m']}%</span>
                                    </div>
                                </div>
                            </div>

                            <div class="prediction-badge">
                                <span>🎯 ${m.analysis.selected_pick}</span>
                                <span>${m.analysis.confidence}%</span>
                            </div>
                        </div>
                    `;
                });

                const isLeagueActive = (cIndex === 0 && lIndex === 0) ? 'active' : '';

                leaguesHTML += `
                    <div class="league-accordion ${isLeagueActive}">
                        <div class="league-header" onclick="toggleAccordion(this)">
                            <span>🏆 ${leagueData.league_name} (${leagueData.matches.length})</span>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="badge-max">Max ${leagueData.max_confidence}%</span>
                                <span class="chevron">▼</span>
                            </div>
                        </div>
                        <div class="league-body">
                            <div class="match-grid">${matchesHTML}</div>
                        </div>
                    </div>
                `;
            });

            countryAcc.innerHTML = `
                <div class="country-header" onclick="toggleAccordion(this)">
                    <div class="country-title">
                        <span>📍 ${countryData.country_name}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge-max">Top Confiance ${countryData.max_confidence}%</span>
                        <span class="chevron">▼</span>
                    </div>
                </div>
                <div class="country-body">
                    ${leaguesHTML}
                </div>
            `;

            container.appendChild(countryAcc);
        });

        // Recalcul initial des hauteurs d'accordéons ouverts
        updateAccordionHeights();

    } catch (e) {
        alert("Erreur lors du chargement des données.");
    } finally {
        btn.classList.remove('scanning');
        btn.innerText = "LANCER LE SCAN";
        btn.disabled = false;
    }
}

function toggleAccordion(headerEl) {
    const parentAcc = headerEl.parentElement;
    parentAcc.classList.toggle('active');
    updateAccordionHeights();
}

function updateAccordionHeights() {
    // Mise à jour dynamique de max-height pour des transitions fluides
    document.querySelectorAll('.league-accordion').forEach(acc => {
        const body = acc.querySelector('.league-body');
        if (acc.classList.contains('active')) {
            body.style.maxHeight = body.scrollHeight + "px";
        } else {
            body.style.maxHeight = "0px";
        }
    });

    document.querySelectorAll('.country-accordion').forEach(acc => {
        const body = acc.querySelector('.country-body');
        if (acc.classList.contains('active')) {
            body.style.maxHeight = body.scrollHeight + 50 + "px";
        } else {
            body.style.maxHeight = "0px";
        }
    });
}
</script>

</body>
</html>
